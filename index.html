<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ブロック崩し</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden; /* 矢印キーでページがスクロールしないように */
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* 900x1000のキャンバスを画面に収まるよう縮小(縦横比は維持) */
    canvas {
      display: block;
      width: auto !important;
      height: auto !important;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <script src="sketch.js"></script>
</body>
</html>
